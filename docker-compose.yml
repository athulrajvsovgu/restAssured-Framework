services:
  petstore-api:
    image: swaggerapi/petstore3:unstable
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8080/api/v3/openapi.json"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
  
  test-petstore:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./target:/app/target
    environment:
      - API_BASE_URL=http://petstore-api:8080/api/v3
    depends_on:
      petstore-api:
        condition: service_healthy