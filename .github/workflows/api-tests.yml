name: RestAssured API Test Pipeline

permissions:
  contents: read
  issues: write
  pull-requests: write

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v1
      
      - name: Start API and Run Tests
        run: |
          docker compose up --build --exit-code-from test-petstore
      
      - name: Publish Test Report
        uses: starburstdata/action-testng-report@v1
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          report_paths: ./target/surefire-reports/testng-results.xml
      
      - name: Upload HTML Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test Execution Report
          path: ./target/surefire-reports/html
          retention-days: 7