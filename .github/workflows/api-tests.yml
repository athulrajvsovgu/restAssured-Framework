name: RestAssured API Test Pipeline

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: write

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v1
      
      - name: Start API and Run Tests
        run: |
          docker compose up --build --exit-code-from test-petstore
      
      - name: Publish Test Report
        uses: scacap/action-surefire-report@v1
        if: always()
        with:
          github_token: ${{ github.token }}
          check_name: Test Report
          create_check: true
          report_paths: ./target/surefire-reports/TEST-*.xml
          
      - name: Publish Execution Results  
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Test execution Results
          path: ./target/surefire-reports/junitreports/TEST-*.xml
          reporter: java-junit
      
      - name: Upload HTML Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test Execution Report
          path: ./target/surefire-reports/html
          retention-days: 7